# Run `mise bootstrap` from a checkout. Everything else lives in
# mise/config.toml + mise/conf.d/*.toml, symlinked into ~/.config/mise.

[bootstrap.repos]
"~/.config/oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }
"~/.config/oh-my-zsh/custom/plugins/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git" }
"~/.config/oh-my-zsh/custom/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git" }

[dotfiles]
"~/.config/mise/config.toml"              = { source = "mise/config.toml", mode = "symlink" }
"~/.config/mise/conf.d/tools.toml"        = { source = "mise/conf.d/tools.toml", mode = "symlink" }
"~/.config/mise/conf.d/shell.toml"        = { source = "mise/conf.d/shell.toml", mode = "symlink" }
"~/.config/mise/conf.d/history.toml"      = { source = "mise/conf.d/history.toml", mode = "symlink" }
"~/.config/mise/conf.d/agents.toml"       = { source = "mise/conf.d/agents.toml", mode = "symlink" }
"~/.config/mise/conf.d/work.toml"         = { source = "mise/conf.d/work.toml", mode = "symlink" }
"~/.config/mise/conf.d/macos.toml"        = { source = "mise/conf.d/macos.toml", mode = "symlink" }
"~/.config/fnox/config.toml"               = { source = "fnox/config.toml", mode = "symlink" }
"~/.config/ghostty/config"                = { source = "config/ghostty/config", mode = "symlink" }
"~/.config/karabiner/karabiner.json"      = { source = "config/karabiner/karabiner.json", mode = "symlink" }
"~/.config/btop"                          = { source = "config/btop", mode = "symlink" }
"~/.config/k9s"                           = { source = "config/k9s", mode = "symlink" }
"~/.config/bat"                           = { source = "config/bat", mode = "symlink" }
"~/.config/tealdeer"                       = { source = "config/tealdeer", mode = "symlink" }
"~/.config/nvim"                          = { source = "nvim", mode = "symlink" }
"~/.config/starship.toml"                 = { source = "config/starship.toml", mode = "symlink" }
"~/.config/aerospace"                     = { source = "config/aerospace", mode = "symlink" }
"~/.config/colima"                        = { source = "config/colima", mode = "symlink" }
"~/.config/linearmouse/linearmouse.json"  = { source = "config/linearmouse/linearmouse.json", mode = "symlink" }
"~/.config/oh-my-zsh/custom/functions.zsh" = { source = "config/zsh/functions.zsh", mode = "symlink" }
"~/.config/worktrunk/config.toml"          = { source = "config/worktrunk/config.toml", mode = "symlink" }
"~/.config/claude/CLAUDE.md"               = { source = "config/claude/CLAUDE.md", mode = "symlink" }
"~/.zprofile"                             = { source = "zprofile", mode = "symlink" }
"~/.gitconfig"                            = { source = "gitconfig", mode = "copy" }
"~/.gitconfig-perso"                      = { source = "gitconfig-perso", mode = "copy" }

[bootstrap.services.mise-history]
builtin = "history-watch"

# Self-hosted Bitwarden server, not a secret.
[bootstrap.hooks.post-tools]
run = "bw status | grep -q '\"serverUrl\":\"https://vault.fapont.xyz\"' || bw config server https://vault.fapont.xyz"

# Closes the global-config chicken-and-egg (history.toml needs the symlink first).
[tasks.bootstrap]
run = "mise bootstrap --only dotfiles --yes"
