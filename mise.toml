# Run `mise bootstrap` from a checkout. Everything else lives in
# mise/config.toml + mise/conf.d/*.toml, symlinked into ~/.config/mise.

[bootstrap.repos]
"~/.config/oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }
"~/.config/oh-my-zsh/custom/plugins/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git" }
"~/.config/oh-my-zsh/custom/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git" }

# <group>/<x> -> ~/.config/<x>, file by file. Dirs that hold runtime state or are
# written by their app stay whole-dir links. Every group applies unless the
# machine picks some in ~/.config/mise/config.local.toml (untracked), e.g. on
# Omarchy: [bootstrap] dotfile_groups = ["config", "omarchy"]
[dotfile_groups.config]
root = "config"
target = "~/.config"
exclude = ["zsh/**"]

[dotfile_groups.config.entries]
"~/.config/btop"   = { mode = "symlink" }

# macOS-only apps (AeroSpace, Karabiner, Vorssaint, Colima)
[dotfile_groups.macos]
root = "macos"
target = "~/.config"

[dotfile_groups.macos.entries]
"~/.config/colima" = { mode = "symlink" }

# Omarchy laptop: Hyprland overrides + default terminal
[dotfile_groups.omarchy]
root = "omarchy"
target = "~/.config"

# Work machine: k8s/cloud tooling (mise/conf.d/work.toml) + k9s
[dotfile_groups.work]
root = "work"
target = "~/.config"

[dotfiles]
"~/.config/mise/config.toml"              = { source = "mise/config.toml", mode = "symlink" }
# symlink-each: every file (folder fragments included) is linked one by one, so
# re-run `mise bootstrap --only dotfiles` after adding one. Machine-local ones
# (e.g. doctolib.toml) can sit next to the links without landing in the repo.
"~/.config/mise/conf.d"                   = { source = "mise/conf.d", mode = "symlink-each" }
"~/.config/fnox/config.toml"               = { source = "fnox/config.toml", mode = "symlink" }
"~/.config/nvim"                          = { source = "nvim", mode = "symlink" }
"~/.config/oh-my-zsh/custom/functions.zsh" = { source = "config/zsh/functions.zsh", mode = "symlink" }
# AI agents: see mise/conf.d/agents/mise.toml for the layout.
# Claude rewrites its settings.json, so fragments are merged INTO it (merge edits own
# only their keys). Arrays are replaced, not unioned: "always allow" entries added
# in a session show up as drift (`mise dot diff`) until moved into a fragment.
# "missing" = defaults only, an app-side change (/config, /plugin) is never overwritten.
"~/.config/claude/settings.json/permissions" = { source = "mise/conf.d/agents/claude/settings.d/10-permissions.json", merge = true }
"~/.config/claude/settings.json/ui"          = { source = "mise/conf.d/agents/claude/settings.d/20-ui.json", merge = "missing" }
"~/.config/claude/settings.json/plugins"     = { source = "mise/conf.d/agents/claude/settings.d/30-plugins.json", merge = "missing" }
"~/.config/claude/CLAUDE.md"               = { source = "mise/conf.d/agents/AGENTS.md", mode = "symlink" }
"~/.zprofile"                             = { source = "zprofile", mode = "symlink" }
# leftover from when ~/.gitconfig{,-perso} were copied from the repo
"~/.gitconfig-perso"                      = { mode = "absent" }
# leftover from before conf.d/agents.toml became the conf.d/agents/ folder fragment
"~/.config/mise/conf.d/agents.toml"        = { mode = "absent" }

# ~/.gitconfig stays a plain, untracked file for machine-local settings. It must
# exist, or `git config --global` (gh auth setup-git...) would write through the
# ~/.config/git/config symlink into the repo.
[bootstrap.hooks.post-dotfiles]
run = '''
[ -e ~/.gitconfig ] || echo "# Machine-local git config, read after ~/.config/git/config (wins)." > ~/.gitconfig
# asks for the git emails on first run (skipped without a TTY or once set)
mise run setup-git-identity
'''

[bootstrap.services.mise-history]
builtin = "history-watch"

# Self-hosted Bitwarden server, not a secret.
[bootstrap.hooks.post-tools]
run = "bw status | grep -q '\"serverUrl\":\"https://vault.fapont.xyz\"' || bw config server https://vault.fapont.xyz"

# Closes the global-config chicken-and-egg (history.toml needs the symlink first).
[tasks.bootstrap]
run = "mise bootstrap --only dotfiles --yes"
