config-version = 2
after-login-command = []

after-startup-command = [
    # 'exec-and-forget sketchybar',
    'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0 hidpi=on',
]

# Notify Sketchybar about workspace change
exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    # 'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
    'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0 hidpi=on',
]


# Start AeroSpace at login
start-at-login = true


# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers                         = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 200

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']


# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodness#disable-hide-app
automatically-unhide-macos-hidden-apps = false

[gaps]
    inner.horizontal = 10
    inner.vertical   = 10
    outer.left       = 10
    outer.bottom     = 10
    outer.top        = [{ monitor."^built-in retina display$" = 10 }, { monitor."^MAG.*$" = 10 }, { monitor."DELL U2424HE" = 10 }, 10]
    outer.right      = 10


    # Set floating Applications
    # [[on-window-detected]]
    #     if.app-name-regex-substring = 'finder'
    #     if.app-name-regex-substring = 'discord'
    #     if.app-name-regex-substring = 'systempreferences'
    #     run                         = 'layout floating'


# See: https://ghostty.org/docs/help/macos-tiling-wms
[[on-window-detected]]
    if.app-id = "com.mitchellh.ghostty"
    run       = ["layout tiling"]


####################
### Applications ###
####################

[[on-window-detected]]
    if.app-id = "com.tinyspeck.slackmacgap"
    run       = ["move-node-to-workspace S"]


[[on-window-detected]]
    if.app-id = "md.obsidian"
    run       = ["move-node-to-workspace O"]

[[on-window-detected]]
    if.app-id = 'com.google.Chrome'
    run = 'move-node-to-workspace G'

[[on-window-detected]]
    if.app-id = 'com.anthropic.claudefordesktop'
    run       = ['move-node-to-workspace C']

##################
### Workspaces ###
##################
[workspace-to-monitor-force-assignment]
    1 = 'main'                            # Monitor sequence number from left to right. 1-based indexing
    2 = 'main'                       # Main monitor
    3 = 'main'                  # Non-main monitor in case when there are only two monitors
    4 = 'main'                   # Case insensitive regex substring
    5 = 'main'
    6 = 2
#    7 = '^built-in retina display$'
    7 = 3
####################
### Key bindings ###
####################
[mode.main.binding]
    # See: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
    cmd-h     = [] # Disable "hide application"
    cmd-alt-h = [] # Disable "hide others"

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    alt-cmd-ctrl-slash = 'layout tiles horizontal vertical'
    alt-cmd-ctrl-comma = 'layout accordion horizontal vertical'

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-cmd-ctrl-h = 'focus left'
    alt-cmd-ctrl-j = 'focus down'
    alt-cmd-ctrl-k = 'focus up'
    alt-cmd-ctrl-l = 'focus right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-cmd-ctrl-shift-h = 'move left'
    alt-cmd-ctrl-shift-j = 'move down'
    alt-cmd-ctrl-shift-k = 'move up'
    alt-cmd-ctrl-shift-l = 'move right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-cmd-ctrl-shift-minus = 'resize smart -50'
    alt-cmd-ctrl-shift-equal = 'resize smart +50'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    alt-cmd-ctrl-1 = 'workspace 1'
    alt-cmd-ctrl-2 = 'workspace 2'
    alt-cmd-ctrl-3 = 'workspace 3'
    alt-cmd-ctrl-4 = 'workspace 4'
    alt-cmd-ctrl-5 = 'workspace 5'
    alt-cmd-ctrl-6 = 'workspace 6'
    alt-cmd-ctrl-7 = 'workspace 7'
    alt-cmd-ctrl-8 = 'workspace 8'

    alt-cmd-ctrl-s = 'workspace S'
    alt-cmd-ctrl-o = 'workspace O'
    alt-cmd-ctrl-g = 'workspace G'
    alt-cmd-ctrl-c = 'workspace C'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    alt-cmd-ctrl-shift-1 = 'move-node-to-workspace 1'
    alt-cmd-ctrl-shift-2 = 'move-node-to-workspace 2'
    alt-cmd-ctrl-shift-3 = 'move-node-to-workspace 3'
    alt-cmd-ctrl-shift-4 = 'move-node-to-workspace 4'
    alt-cmd-ctrl-shift-5 = 'move-node-to-workspace 5'
    alt-cmd-ctrl-shift-6 = 'move-node-to-workspace 6'
    alt-cmd-ctrl-shift-7 = 'move-node-to-workspace 7'
    alt-cmd-ctrl-shift-8 = 'move-node-to-workspace 8'

# Custom commands
    alt-cmd-ctrl-f = 'fullscreen'
    alt-cmd-ctrl-shift-f = 'macos-native-fullscreen'
    alt-cmd-ctrl-q = 'close'


    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-cmd-ctrl-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-cmd-ctrl-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-cmd-ctrl-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r   = ['flatten-workspace-tree', 'mode main'] # reset layout
    #s = ['layout sticky tiling', 'mode main'] # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    f = [
        'layout floating tiling',
        'mode main',
    ] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-cmd-ctrl-shift-h = ['join-with left', 'mode main']
    alt-cmd-ctrl-shift-j = ['join-with down', 'mode main']
    alt-cmd-ctrl-shift-k = ['join-with up', 'mode main']
    alt-cmd-ctrl-shift-l = ['join-with right', 'mode main']
