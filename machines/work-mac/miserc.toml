# The macOS work laptop. This folder is ~/.config/mise on that machine
# (`mise bootstrap --config-dir machines/work-mac`): conf.d holds every module, and
# this file, read before any config, picks them: each name loads
# modules/<name>/mise.<name>.toml (modules/core/mise.toml always loads).
# auto_env stays off: modules/macos/mise.macos.toml loads only when listed.
auto_env = false
env = [
  "shell", "starship", "eza", "bat", "btop", "tealdeer", "zoxide", "fzf", "atuin", "cli", "python",
  "git", "secrets", "agents", "herdr", "nvim", "ghostty", "obsidian", "netbird",
  "macos", "aerospace",
  "docker", "k8s", "cloud", "dev",
]
