default_provider = "bitwarden"

[providers.bitwarden]
type = "bitwarden"

# Générer une fois : ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519_age -C "fnox age"
# Puis remplacer `recipients` par le contenu de ~/.ssh/id_ed25519_age.pub
[providers.age]
type = "age"
recipients = []
key_file = "~/.ssh/id_ed25519_age"

[secrets]
GH_TOKEN     = { provider = "bitwarden", value = "GitHub CLI Token", env = "exec" }
GITHUB_TOKEN = { provider = "bitwarden", value = "GitHub CLI Token", env = "exec" }
