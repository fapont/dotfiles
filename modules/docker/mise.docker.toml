# Docker CLI on Colima (Lima VM), plus Apple's `container`.
[tools]
docker-cli = "latest"
lima = "latest"
colima = "latest"
# postinstall `when = "always"`: the cli-plugins links are re-created on every
# `mise install`, not only on a fresh install of a new version. No nested
# `mise which` there: inside `mise bootstrap` it can fail and leave empty links.
"github:docker/compose" = { version = "latest", asset_pattern = "docker-compose-darwin-aarch64", bin = "docker-compose", postinstall = { when = "always", run = """
mkdir -p ~/.docker/cli-plugins
ln -sf "$MISE_TOOL_INSTALL_PATH/docker-compose" ~/.docker/cli-plugins/docker-compose
""" } }
"github:docker/buildx" = { version = "latest", asset_pattern = "buildx-v*.darwin-arm64", bin = "docker-buildx", postinstall = { when = "always", run = """
mkdir -p ~/.docker/cli-plugins
ln -sf "$MISE_TOOL_INSTALL_PATH/docker-buildx" ~/.docker/cli-plugins/docker-buildx
""" } }

[bootstrap.packages]
"brew:container" = "latest"

[shell_alias]
dcu = 'docker compose up'
dcd = 'docker compose down'
dcl = 'docker compose logs'
dcr = 'docker compose restart'

[dotfile_groups.docker]
root = "docker/home"
# Only default/colima.yaml is linked: ~/.config/colima stays a real dir for the
# VM state (in the repo, its socket paths exceed macOS's 104-char limit).
