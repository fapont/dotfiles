# LazyVim.
[tools]
# Omarchy ships it. aqua, not the registry's default vfox: mise resolves the
# version even where `os` skips the tool, and vfox's listing timed out there on
# every new shell.
"aqua:neovim/neovim" = { version = "latest", os = "macos" }

[shell_alias]
vim = 'nvim'

[dotfile_groups.nvim]
root = "nvim/home"

[dotfile_groups.nvim.entries]
# lazy.nvim rewrites lazy-lock.json, so the whole dir is linked
"~/.config/nvim" = { mode = "symlink" }
