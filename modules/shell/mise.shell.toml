# zsh: oh-my-zsh, env, login shell and the ~/.zshrc blocks. A block calls the
# tool of its module (starship, fnox, zoxide...): keep them listed together.
# Shell functions that belong to a tool live in its module, as
# home/.config/oh-my-zsh/custom/<tool>.zsh (oh-my-zsh sources every *.zsh there).

[bootstrap.repos]
"~/.config/oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }
"~/.config/oh-my-zsh/custom/plugins/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git" }
"~/.config/oh-my-zsh/custom/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git" }

[env]
XDG_DATA_HOME   = "{{env.HOME}}/.local/share"
XDG_CONFIG_HOME = "{{env.HOME}}/.config"
XDG_STATE_HOME  = "{{env.HOME}}/.local/state"

[bootstrap.packages]
"pacman:zsh" = { version = "latest", os = "linux" }

# /bin/zsh on both macOS and Arch (/bin -> /usr/bin); mise adds it to /etc/shells.
[bootstrap.user]
login_shell = "/bin/zsh"

[dotfile_groups.shell]
root = "shell/home"

# ~/.zshrc stays a live file (tools append to it); mise owns only these blocks.
# track/[history.*] only work from mise's global config.
[dotfiles]
"~/.zshrc" = { mode = "track" }
"~/.zshrc/omz-init" = { block = '''
export ZSH="$HOME/.config/oh-my-zsh"
plugins=(git docker docker-compose kubectl kubectx aws gcloud helm gh common-aliases command-not-found zsh-autosuggestions zsh-syntax-highlighting)
source "$ZSH/oh-my-zsh.sh"
''' }
# Kept as an ordered block (not [bootstrap.mise_shell_activate], which appends its
# own) so mise is active before the inits below.
# mise.run puts it in ~/.local/bin (macOS), Omarchy's pacman in /usr/bin.
"~/.zshrc/mise-activate" = { block = 'eval "$(${commands[mise]:-$HOME/.local/bin/mise} activate zsh)"' }
"~/.zshrc/starship-init" = { block = 'eval "$(starship init zsh)"' }
"~/.zshrc/fnox-activate" = { block = 'eval "$(fnox activate zsh)"' }
"~/.zshrc/zoxide-init" = { block = 'eval "$(zoxide init zsh --cmd cd)"' }
"~/.zshrc/atuin-init" = { block = 'eval "$(atuin init zsh)"' }
"~/.zshrc/fzf-init" = { block = 'eval "$(fzf --zsh)"' }
"~/.zshrc/wt-init" = { block = 'eval "$(wt config shell init zsh)"' }
"~/.zshrc/carapace-init" = { block = 'source <(carapace _carapace zsh)' }

# Commits ~/.zshrc drift (`mise history`) back to this repo.
[history.origin]
url = "https://github.com/fapont/dotfiles.git"

[history]
# checkpoint commits say which machine saved them
git_email = "mise@{hostname}"

[settings.history]
sync = "manual"

[bootstrap.services.mise-history]
builtin = "history-watch"
