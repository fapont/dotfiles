# herdr, the agent-aware terminal multiplexer (trial, alongside cmux).
[tools]
herdr = "latest"

# macOS system toasts (config.toml [ui.toast]) bring Ghostty to the front on click.
[bootstrap.packages]
"brew:terminal-notifier" = { version = "latest", os = "macos" }

[dotfile_groups.herdr]
root = "herdr/home"

# herdr-core: Herdr Mobile runs it over SSH and looks only on PATH and in
# ~/.local/bin. Published outside GitHub releases (no mise backend), installed
# once by its official script, then kept current by `hc update`.
# herdr skill, release-matched: regenerated from the installed binary on every
# bootstrap, so it follows herdr updates.
[bootstrap.hooks.post-tools]
run = '''
[ -x "$HOME/.local/bin/herdr-core" ] || curl -fsSL https://releases.herdr.dev/core/install.sh | sh
command -v herdr >/dev/null || exit 0
skill="$HOME/.agents/skills/herdr"
mkdir -p "$skill" && herdr --skill > "$skill/SKILL.md"
claude_skills="${CLAUDE_CONFIG_DIR:-$HOME/.config/claude}/skills"
mkdir -p "$claude_skills" && ln -sfn "$skill" "$claude_skills/herdr"
'''
