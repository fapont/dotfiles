# -> ~/.config/herdr/config.toml. Full reference: `herdr --default-config`.
# Apply edits with prefix+shift+r or `herdr server reload-config`.
onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[ui]
status_indicators = "symbols"
# Attention queue: blocked agents float to the top of the sidebar.
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
tab_bar_right = [{ type = "zoom" }]

# What each agent is on (Claude's session title) and, when blocked, why
# (state label set by the Notification hook in claude/settings.d/40-hooks.json).
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["state_text"]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[terminal]
# Login shells on Linux too ("auto" only does it on macOS): otherwise panes
# skip /etc/profile, so no LANG from /etc/locale.conf and zsh garbles Tab
# completion under the POSIX locale.
shell_mode = "login"

[ui.toast]
# macOS: needs terminal-notifier (herdr/mise.herdr.toml) to bring Ghostty to
# the front on click; the pane itself is then one ctrl+alt+o away.
delivery = "system"

# Prefix bindings stay; ctrl+alt chords on top need no prefix. ctrl+alt is
# free in Ghostty and AeroSpace (whose super is ctrl+alt+cmd) and is not
# composed by the macOS option key. Digits are skipped: AZERTY needs shift.
[keys]
prefix = "ctrl+a"
# prefix+s was settings
settings = "prefix+alt+s"
split_vertical = ["prefix+v", "ctrl+alt+v"]
split_horizontal = ["prefix+s", "prefix+minus", "ctrl+alt+s"]
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
zoom = ["prefix+z", "ctrl+alt+z"]
new_tab = ["prefix+c", "ctrl+alt+c"]
previous_tab = ["prefix+p", "ctrl+alt+p"]
next_tab = ["prefix+n", "ctrl+alt+n"]
# Agent-first navigation: jump to whoever pinged, cycle agents, search them all
# (in the picker, `b` filters blocked agents).
open_notification_target = ["prefix+o", "ctrl+alt+o"]
next_agent = ["prefix+a", "ctrl+alt+a"]
previous_agent = ["prefix+shift+a", "ctrl+alt+shift+a"]
goto = ["prefix+g", "ctrl+alt+g"]
next_workspace = "ctrl+alt+w"
previous_workspace = "ctrl+alt+shift+w"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

[experimental]
# Keep pane scrollback across full server restarts, not just detaches.
pane_history = true
