# herdr, the agent-aware terminal multiplexer (trial, alongside cmux).
[tools]
herdr = "latest"

[dotfile_groups.herdr]
root = "herdr/home"

# herdr skill, release-matched: regenerated from the installed binary on every
# bootstrap, so it follows herdr updates.
[bootstrap.hooks.post-tools]
run = '''
command -v herdr >/dev/null || exit 0
skill="$HOME/.agents/skills/herdr"
mkdir -p "$skill" && herdr --skill > "$skill/SKILL.md"
claude_skills="${CLAUDE_CONFIG_DIR:-$HOME/.config/claude}/skills"
mkdir -p "$claude_skills" && ln -sfn "$skill" "$claude_skills/herdr"
'''
