# git, gh, worktrunk, and the per-machine identities.
[tools]
github-cli = "latest"
# registry short name: signed packslip install (0.80+), ships completions + skills
worktrunk = "latest"

[shell_alias]
main = 'git switch main && git pull'

[dotfile_groups.git]
root = "git/home"

[dotfile_groups.git.entries]
# Rendered from identity-*.tera with this machine's emails ([vars] below)
"~/.config/git/identity-work"  = { mode = "template" }
"~/.config/git/identity-perso" = { mode = "template" }

# Emails stay out of the repo: asked once per machine by `mise bootstrap
# --prompt-vars` (or `mise vars prompt`), saved in $MISE_STATE_DIR/vars.toml.
[vars.git_email_work]
prompt = "Work git email (e.g. first.last@company.com)"
required = "Run `mise vars prompt` to set it"

[vars.git_email_perso]
prompt = "Personal git email (e.g. <id>+<user>@users.noreply.github.com)"
required = "Run `mise vars prompt` to set it"

# ~/.gitconfig stays a plain, untracked file for machine-local settings. It must
# exist, or `git config --global` (gh auth setup-git...) would write through the
# ~/.config/git/config symlink into the repo.
[bootstrap.hooks.post-dotfiles]
run = '''
[ -e ~/.gitconfig ] || echo "# Machine-local git config, read after ~/.config/git/config (wins)." > ~/.gitconfig
'''

# setup-github-ssh
[task_config]
includes = ["tasks"]
