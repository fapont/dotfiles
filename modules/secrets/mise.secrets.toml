# fnox (age-encrypted secrets in home/.config/fnox/config.toml), its age key
# kept in Bitwarden (task restore-secrets), and the Bitwarden CLI session.
[tools]
fnox = "latest"
age = "latest"
bitwarden = "latest"

[shell_alias]
bwu = 'bw unlock --raw | age -r "$(cat ~/.ssh/id_ed25519_age.pub)" -o ~/.local/state/bw-session.age && export BW_SESSION=$(age -d -i ~/.ssh/id_ed25519_age ~/.local/state/bw-session.age)'

[env]
# live decrypt each time, never cached in plaintext
BW_SESSION = "{{ exec(command='age -d -i $HOME/.ssh/id_ed25519_age $HOME/.local/state/bw-session.age 2>/dev/null || true') }}"

[bootstrap.packages]
"brew-cask:bitwarden" = { version = "latest", os = "macos" }
"pacman:bitwarden" = { version = "latest", os = "linux" }

[dotfile_groups.secrets]
root = "secrets/home"

# Self-hosted Bitwarden server, not a secret.
[bootstrap.hooks.post-tools]
run = "bw status | grep -q '\"serverUrl\":\"https://vault.fapont.xyz\"' || bw config server https://vault.fapont.xyz"

# restore-secrets
[task_config]
includes = ["tasks"]
