[settings]
# évite le "Trust them with `mise trust`" à chaque nouveau fichier sous ces dossiers
trusted_config_paths = ["~/.config/mise", "~/Doctolib", "~/Perso"]

[tools]
jq = "latest"
yq = "latest"
bat = "latest"
eza = "latest"
fd = "latest"
zoxide = "latest"
ripgrep = "latest"
github-cli = "latest"
neovim = "latest"
lazygit = "latest"
starship = "latest"
usage = "latest"
fzf = "latest"          # cmux remplace tmux -> plus de conflit fzf-tmux
delta = "latest"        # pager git diff/grep avec coloration syntaxique
tealdeer = "latest"     # client tldr rapide
glow = "latest"         # rendu markdown dans le terminal
atuin = "latest"        # historique shell SQLite + sync chiffrée
python = "latest"
uv = "latest"

[shell_alias]
cat    = 'bat'
vim    = 'nvim'
diff   = 'delta'
ls     = 'eza --color=always --long --git --no-filesize --icons=always --no-time --no-user --no-permissions'
la     = 'eza --color=always --long --git --no-filesize --icons=always --no-time --no-user --no-permissions -a'
python = 'python3'

[env]
XDG_DATA_HOME   = "{{env.HOME}}/.local/share"
XDG_CONFIG_HOME = "{{env.HOME}}/.config"
XDG_STATE_HOME  = "{{env.HOME}}/.local/state"
# gcloud embarque son propre bootstrapping Python et ignore le python système
# (3.9 sur macOS, non supporté) -- on le pointe vers le python géré par mise.
CLOUDSDK_PYTHON = "{{env.HOME}}/.local/share/mise/installs/python/latest/bin/python"

# tracké en place (pas déplacé) : contient la ligne `mise activate` + tout ce
# qu'oh-my-zsh/autres outils y ajoutent -- l'historique mise le sauvegarde
# automatiquement, y compris entre deux bootstraps. `track` n'est reconnu que
# depuis la config globale (~/.config/mise/config.toml), pas depuis mise.toml
# à la racine du repo -- c'est pour ça qu'il est ici et pas là-bas.
[dotfiles]
"~/.zshrc" = { mode = "track" }

[history.origin]
url = "https://github.com/fapont/dotfiles.git"

[settings.history]
# Commence en "manual" (mise dot save / mise dot history) le temps de
# valider le comportement -- passer à "sync" pour un push automatique
# périodique une fois éprouvé sur cette machine.
sync = "manual"
