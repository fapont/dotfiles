# Folder fragment for the shell (same layout as conf.d/obsidian/):
#
#   mise.toml        aliases, env, login shell, ~/.zshrc blocks (this file)
#   functions.zsh    zsh functions that must run in the current shell
#   zprofile         -> ~/.zprofile
#
# oh-my-zsh and its plugins are cloned by [bootstrap.repos] in the root mise.toml.

[shell_alias]
gst    = 'git status'
cat    = 'bat'
vim    = 'nvim'
diff   = 'delta'
ls     = 'eza --color=always --long --git --no-filesize --icons=always --no-time --no-user --no-permissions'
la     = 'eza --color=always --long --git --no-filesize --icons=always --no-time --no-user --no-permissions -a'
python = 'python3'
bwu    = 'bw unlock --raw | age -r "$(cat ~/.ssh/id_ed25519_age.pub)" -o ~/.local/state/bw-session.age && export BW_SESSION=$(age -d -i ~/.ssh/id_ed25519_age ~/.local/state/bw-session.age)'

[env]
XDG_DATA_HOME   = "{{env.HOME}}/.local/share"
XDG_CONFIG_HOME = "{{env.HOME}}/.config"
XDG_STATE_HOME  = "{{env.HOME}}/.local/state"
# Loads mise/config.<os>.toml (picks the dotfile groups).
# Read at mise startup, so the first `mise bootstrap` passes it by hand.
MISE_AUTO_ENV   = "1"
# live decrypt each time, never cached in plaintext
BW_SESSION = "{{ exec(command='age -d -i $HOME/.ssh/id_ed25519_age $HOME/.local/state/bw-session.age 2>/dev/null || true') }}"

# /bin/zsh on both macOS and Arch (/bin -> /usr/bin); mise adds it to /etc/shells.
[bootstrap.user]
login_shell = "/bin/zsh"

# track/edit/[history.*] only work from mise's global config, not mise.toml.
[dotfiles]
"~/.zprofile"                              = { source = "~/.dotfiles/mise/conf.d/shell/zprofile", mode = "symlink" }
"~/.config/oh-my-zsh/custom/functions.zsh" = { source = "~/.dotfiles/mise/conf.d/shell/functions.zsh", mode = "symlink" }
"~/.zshrc" = { mode = "track" }
"~/.zshrc/omz-init" = { block = '''
export ZSH="$HOME/.config/oh-my-zsh"
plugins=(git docker docker-compose kubectl kubectx aws gcloud helm gh common-aliases command-not-found zsh-autosuggestions zsh-syntax-highlighting)
source "$ZSH/oh-my-zsh.sh"
''' }
# Kept as an ordered block (not [bootstrap.mise_shell_activate], which appends its
# own) so mise is active before the starship/fnox/zoxide/... inits below.
# mise.run puts it in ~/.local/bin (macOS), Omarchy's pacman in /usr/bin.
"~/.zshrc/mise-activate" = { block = 'eval "$(${commands[mise]:-$HOME/.local/bin/mise} activate zsh)"' }
"~/.zshrc/starship-init" = { block = 'eval "$(starship init zsh)"' }
"~/.zshrc/fnox-activate" = { block = 'eval "$(fnox activate zsh)"' }
"~/.zshrc/zoxide-init" = { block = 'eval "$(zoxide init zsh --cmd cd)"' }
"~/.zshrc/atuin-init" = { block = 'eval "$(atuin init zsh)"' }
"~/.zshrc/fzf-init" = { block = 'eval "$(fzf --zsh)"' }
"~/.zshrc/wt-init" = { block = 'eval "$(wt config shell init zsh)"' }
"~/.zshrc/carapace-init" = { block = 'source <(carapace _carapace zsh)' }

# Commits ~/.zshrc drift (`mise history`) back to this repo.
[history.origin]
url = "https://github.com/fapont/dotfiles.git"

[history]
# checkpoint commits say which machine saved them
git_email = "mise@{hostname}"

[settings.history]
sync = "manual"
