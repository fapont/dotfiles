# Folder fragment for AI coding agents (same layout as conf.d/obsidian/):
#
#   mise.toml               agent CLIs, aliases, env (this file)
#   AGENTS.md               global instructions, linked under each agent's
#                           expected name (~/.config/claude/CLAUDE.md...)
#   claude/settings.d/      Claude Code settings fragments (tracked, public),
#                           merged into the untracked live settings.json by
#                           `mise run claude-settings` (--diff to compare)
#   tasks/                  file tasks, `mise run <name>` from any directory
#
# Add an agent = a <agent>/ folder + its links in the root mise.toml [dotfiles].
# Shared skills will go in skills/<name>/SKILL.md (Agent Skills format, read by
# Claude Code, Codex, opencode and pi), linked into each agent's skills dir.

[tools]
# registry short name: signed packslip install (0.80+), ships completions + skills
worktrunk = "latest"
claude = "latest"
node = "lts"
"npm:ccstatusline" = "latest"

[shell_alias]
# wt-clone is a zsh function (config/zsh/functions.zsh), not an alias here --
# it needs to cd and re-run `wt` after cloning, which a plain alias can't do.
wsc = 'wt switch --create --execute=claude'
claude = 'fnox exec -- claude'

[env]
CLAUDE_CONFIG_DIR = "{{env.HOME}}/.config/claude"

[task_config]
includes = ["tasks"]
