# Folder fragment for AI coding agents (same layout as conf.d/obsidian/):
#
#   mise.toml               agent CLIs, aliases, env (this file)
#   AGENTS.md               global instructions, linked under each agent's
#                           expected name (~/.config/claude/CLAUDE.md...)
#   claude/settings.d/      Claude Code settings fragments (tracked, public),
#                           merged into the untracked live settings.json by the
#                           [dotfiles] entries below
#   claude/mcp.json         user-scope MCP servers, merged into .claude.json
#
# Add an agent = a <agent>/ folder + its links in [dotfiles] below.
# Shared skills live in ~/.agents/skills/<name>/ (Agent Skills format), the
# global dir Codex, pi, Zed... read natively; agents with their own dir get one
# link per skill (Claude keeps a synced/ dir in its skills/, so never the whole dir).

[tools]
# registry short name: signed packslip install (0.80+), ships completions + skills
worktrunk = "latest"
claude = "latest"
# agent-aware terminal multiplexer (trial, alongside cmux)
herdr = "latest"
"npm:@agentclientprotocol/claude-agent-acp" = "latest"
node = "lts"
"npm:ccstatusline" = "latest"
# spec-kit: `specify` CLI (spec-driven development), not in the registry
"pipx:github/spec-kit" = "latest"

[shell_alias]
# wt-clone is a zsh function (conf.d/shell/functions.zsh), not an alias here --
# it needs to cd and re-run `wt` after cloning, which a plain alias can't do.
wsc = 'wt switch --create --execute=claude'
claude = 'fnox exec -- claude'

[env]
CLAUDE_CONFIG_DIR = "{{env.HOME}}/.config/claude"

# herdr skill, release-matched: regenerated from the installed binary on every
# bootstrap, so it follows herdr updates.
[bootstrap.hooks.post-tools]
run = '''
command -v herdr >/dev/null || exit 0
skill="$HOME/.agents/skills/herdr"
mkdir -p "$skill" && herdr --skill > "$skill/SKILL.md"
claude_skills="${CLAUDE_CONFIG_DIR:-$HOME/.config/claude}/skills"
mkdir -p "$claude_skills" && ln -sfn "$skill" "$claude_skills/herdr"
'''

# Claude rewrites its settings.json, so fragments are merged INTO it (merge edits own
# only their keys). Arrays are replaced, not unioned: "always allow" entries added
# in a session show up as drift (`mise dot diff`) until moved into a fragment.
# "missing" = defaults only, an app-side change (/config, /plugin) is never overwritten.
[dotfiles]
"~/.config/claude/CLAUDE.md"                 = { source = "~/.dotfiles/mise/conf.d/agents/AGENTS.md", mode = "symlink" }
"~/.config/claude/settings.json/permissions" = { source = "~/.dotfiles/mise/conf.d/agents/claude/settings.d/10-permissions.json", merge = true }
"~/.config/claude/settings.json/ui"          = { source = "~/.dotfiles/mise/conf.d/agents/claude/settings.d/20-ui.json", merge = "missing" }
"~/.config/claude/settings.json/plugins"     = { source = "~/.dotfiles/mise/conf.d/agents/claude/settings.d/30-plugins.json", merge = "missing" }
# User-scope MCP servers live in .claude.json (also Claude's state file, never tracked).
# Secrets are ${VAR}s from fnox, expanded by Claude at startup.
"~/.config/claude/.claude.json/mcp"          = { source = "~/.dotfiles/mise/conf.d/agents/claude/mcp.json", merge = "missing" }
