[tools]
argocd      = 'latest'
teleport-ent = '18.10.0'
pre-commit  = 'latest'
aws-cli     = { version = "latest", symlink_bins = true }
aws-vault   = 'latest'
gcloud      = 'latest'
kubectl     = 'latest'
kubectx     = 'latest'
kubens      = 'latest'
kubeconform = 'latest'
minikube    = 'latest'
k9s         = 'latest'
helm        = 'latest'
copier      = 'latest'
just        = 'latest'
trivy       = 'latest'
"github:DataDog/pup" = { version = "latest", asset_pattern = "pup_*_Darwin_arm64.tar.gz" }
rclone      = 'latest'
git-lfs     = 'latest'
docker-cli = "latest"
lima = 'latest'
colima = 'latest'
# postinstall `when = "always"`: the cli-plugins links are re-created on every
# `mise install`, not only on a fresh install of a new version.
"github:docker/compose" = { version = "latest", asset_pattern = "docker-compose-darwin-aarch64", bin = "docker-compose", postinstall = { when = "always", run = """
mkdir -p ~/.docker/cli-plugins
ln -sf "$(mise which docker-compose)" ~/.docker/cli-plugins/docker-compose
""" } }
"github:docker/buildx" = { version = "latest", asset_pattern = "buildx-v*.darwin-arm64", bin = "docker-buildx", postinstall = { when = "always", run = """
mkdir -p ~/.docker/cli-plugins
ln -sf "$(mise which docker-buildx)" ~/.docker/cli-plugins/docker-buildx
""" } }

[shell_alias]
ktx    = 'kubectx'
kns    = 'kubens'
kgp    = 'kubectl get pods'
dcu    = 'docker compose up'
dcd    = 'docker compose down'
dcl    = 'docker compose logs'
dcr    = 'docker compose restart'
main   = 'git switch main && git pull'
