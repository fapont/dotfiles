# Global (linked into ~/.config/mise/conf.d), not in the repo's mise.toml: a project
# config is only read inside ~/.dotfiles, so elsewhere these links looked orphaned.
# Sources are absolute (a relative one resolves from mise/conf.d/); group roots
# resolve from dotfiles.root, ~/.dotfiles by default, like the README clone.

# <group>/<x> -> ~/.config/<x>, file by file. Dirs that hold runtime state or are
# written by their app stay whole-dir links. mise/config.<os>.toml
# picks the groups per OS (MISE_AUTO_ENV); without it, every group applies.
[dotfile_groups.config]
root = "config"
target = "~/.config"
exclude = ["zsh/**"]

[dotfile_groups.config.entries]
"~/.config/btop"   = { mode = "symlink" }
# lazy.nvim rewrites lazy-lock.json, so the whole dir is linked
"~/.config/nvim"   = { mode = "symlink" }
# Rendered from identity-*.tera with this machine's emails (see [vars] below)
"~/.config/git/identity-work"  = { mode = "template" }
"~/.config/git/identity-perso" = { mode = "template" }

# macOS-only apps (AeroSpace, Vorssaint, Colima)
[dotfile_groups.macos]
root = "macos"
target = "~/.config"

[dotfile_groups.macos.entries]
"~/.config/colima" = { mode = "symlink" }

# Omarchy laptop: Hyprland overrides + default terminal
[dotfile_groups.omarchy]
root = "omarchy"
target = "~/.config"

# Work machine: k8s/cloud tooling (mise/conf.d/work.toml) + k9s
[dotfile_groups.work]
root = "work"
target = "~/.config"

[dotfiles]
"~/.config/mise/config.toml"              = { source = "~/.dotfiles/mise/config.toml", mode = "symlink" }
"~/.config/mise/config.macos.toml"        = { source = "~/.dotfiles/mise/config.macos.toml", mode = "symlink" }
"~/.config/mise/config.linux.toml"        = { source = "~/.dotfiles/mise/config.linux.toml", mode = "symlink" }
# symlink-each: every file (folder fragments included) is linked one by one, so
# re-run `mise bootstrap --only dotfiles` after adding one. Machine-local ones
# (e.g. doctolib.toml) can sit next to the links without landing in the repo.
"~/.config/mise/conf.d"                   = { source = "~/.dotfiles/mise/conf.d", mode = "symlink-each" }
"~/.config/oh-my-zsh/custom/functions.zsh" = { source = "~/.dotfiles/config/zsh/functions.zsh", mode = "symlink" }
# AI agents: see mise/conf.d/agents/mise.toml for the layout.
# Claude rewrites its settings.json, so fragments are merged INTO it (merge edits own
# only their keys). Arrays are replaced, not unioned: "always allow" entries added
# in a session show up as drift (`mise dot diff`) until moved into a fragment.
# "missing" = defaults only, an app-side change (/config, /plugin) is never overwritten.
"~/.config/claude/settings.json/permissions" = { source = "~/.dotfiles/mise/conf.d/agents/claude/settings.d/10-permissions.json", merge = true }
"~/.config/claude/settings.json/ui"          = { source = "~/.dotfiles/mise/conf.d/agents/claude/settings.d/20-ui.json", merge = "missing" }
"~/.config/claude/settings.json/plugins"     = { source = "~/.dotfiles/mise/conf.d/agents/claude/settings.d/30-plugins.json", merge = "missing" }
# User-scope MCP servers live in .claude.json (also Claude's state file, never tracked).
# Secrets are ${VAR}s from fnox, expanded by Claude at startup.
"~/.config/claude/.claude.json/mcp"          = { source = "~/.dotfiles/mise/conf.d/agents/claude/mcp.json", merge = "missing" }
"~/.config/claude/CLAUDE.md"               = { source = "~/.dotfiles/mise/conf.d/agents/AGENTS.md", mode = "symlink" }
"~/.zprofile"                             = { source = "~/.dotfiles/config/zsh/zprofile", mode = "symlink" }

# Git emails stay out of the repo: asked once per machine by `mise bootstrap
# --prompt-vars` (or `mise vars prompt`), saved in $MISE_STATE_DIR/vars.toml.
[vars.git_email_work]
prompt = "Work git email (e.g. first.last@company.com)"
required = "Run `mise vars prompt` to set it"

[vars.git_email_perso]
prompt = "Personal git email (e.g. <id>+<user>@users.noreply.github.com)"
required = "Run `mise vars prompt` to set it"
