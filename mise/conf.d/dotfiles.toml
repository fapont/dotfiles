# What goes where. Other [dotfiles] entries sit with their domain:
# conf.d/shell/ (zsh) and conf.d/agents/ (Claude).
#
# Global (linked into ~/.config/mise/conf.d), not in the repo's mise.toml: a project
# config is only read inside ~/.dotfiles, so elsewhere these links looked orphaned.
# Sources are absolute (a relative one resolves from mise/conf.d/); group roots
# resolve from dotfiles.root, ~/.dotfiles by default, like the README clone.

# A group = one machine role. <group>/<x> -> ~/.config/<x>, file by file, so a
# group's mise/conf.d/*.toml lands in ~/.config/mise/conf.d: its packages and
# tools stay in its folder. Dirs that hold runtime state or are written by their
# app stay whole-dir links. mise/config.<os>.toml picks the groups per OS
# (MISE_AUTO_ENV); without it, every group applies.
[dotfile_groups.config]
root = "config"
target = "~/.config"

[dotfile_groups.config.entries]
"~/.config/btop"   = { mode = "symlink" }
# lazy.nvim rewrites lazy-lock.json, so the whole dir is linked
"~/.config/nvim"   = { mode = "symlink" }
# Rendered from identity-*.tera with this machine's emails (see [vars] below)
"~/.config/git/identity-work"  = { mode = "template" }
"~/.config/git/identity-perso" = { mode = "template" }

# macOS work laptop: apps (AeroSpace, Vorssaint, Colima) + mise/conf.d/macos.toml
[dotfile_groups.macos]
root = "macos"
target = "~/.config"

[dotfile_groups.macos.entries]
"~/.config/colima" = { mode = "symlink" }

# Omarchy laptop: Hyprland overrides, default terminal + mise/conf.d/omarchy.toml
[dotfile_groups.omarchy]
root = "omarchy"
target = "~/.config"

# Work machine: k8s/cloud tooling (mise/conf.d/work.toml) + k9s
[dotfile_groups.work]
root = "work"
target = "~/.config"

[dotfiles]
"~/.config/mise/config.toml"              = { source = "~/.dotfiles/mise/config.toml", mode = "symlink" }
"~/.config/mise/config.macos.toml"        = { source = "~/.dotfiles/mise/config.macos.toml", mode = "symlink" }
"~/.config/mise/config.linux.toml"        = { source = "~/.dotfiles/mise/config.linux.toml", mode = "symlink" }
# symlink-each: every file (folder fragments included) is linked one by one, so
# re-run `mise bootstrap --only dotfiles` after adding one. Machine-local ones
# (e.g. doctolib.toml) can sit next to the links without landing in the repo.
"~/.config/mise/conf.d"                   = { source = "~/.dotfiles/mise/conf.d", mode = "symlink-each" }

# Git emails stay out of the repo: asked once per machine by `mise bootstrap
# --prompt-vars` (or `mise vars prompt`), saved in $MISE_STATE_DIR/vars.toml.
[vars.git_email_work]
prompt = "Work git email (e.g. first.last@company.com)"
required = "Run `mise vars prompt` to set it"

[vars.git_email_perso]
prompt = "Personal git email (e.g. <id>+<user>@users.noreply.github.com)"
required = "Run `mise vars prompt` to set it"
