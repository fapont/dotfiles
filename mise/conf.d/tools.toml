# CLI génériques, multi-plateformes (macOS/Linux) -- les outils spécifiques à
# une plateforme ou à un contexte vivent dans les autres fichiers de conf.d/.
[tools]
jq = "latest"
yq = "latest"
bat = "latest"
eza = "latest"
fd = "latest"
zoxide = "latest"
ripgrep = "latest"
github-cli = "latest"
neovim = "latest"
lazygit = "latest"
starship = "latest"
usage = "latest"
fzf = "latest"          # cmux remplace tmux -> plus de conflit fzf-tmux
delta = "latest"        # pager git diff/grep avec coloration syntaxique
tealdeer = "latest"     # client tldr rapide
glow = "latest"         # rendu markdown dans le terminal
atuin = "latest"        # historique shell SQLite + sync chiffrée
python = "latest"
uv = "latest"
