# Omarchy (Arch + Hyprland) counterpart of macos.toml. pacman/aur entries are
# skipped on machines without those managers, so this file is safe everywhere.
# Omarchy owns the desktop itself (Hyprland, Waybar, themes, ~/.local/share/omarchy):
# only what it doesn't ship is declared here (v4 ships foot, not ghostty). The
# CLIs it does ship (jq, bat, eza...) are macOS-only in tools.toml. On that
# machine, pick the shared dotfiles only in ~/.config/mise/config.local.toml:
#   [bootstrap]
#   dotfile_groups = ["config", "omarchy"]

[bootstrap.packages]
"pacman:zsh"                   = "latest"
"pacman:tree"                  = "latest"
"pacman:ghostty"               = "latest"
"pacman:zed"                   = "latest"
"pacman:bitwarden"             = "latest"
"pacman:telegram-desktop"      = "latest"
"aur:brave-bin"                = "latest"

# Catppuccin like the rest of the configs, applied once: a theme picked later
# from the Omarchy menu is never overridden. Retried until it succeeds (needs
# the Hyprland session).
[bootstrap.hooks.post-dotfiles]
run = '''
command -v omarchy-theme-set >/dev/null || exit 0
marker="${XDG_STATE_HOME:-$HOME/.local/state}/dotfiles/omarchy-theme-set"
[ -e "$marker" ] && exit 0
if omarchy-theme-set catppuccin; then mkdir -p "${marker%/*}" && touch "$marker"
else echo "omarchy-theme-set failed, will retry on next bootstrap" >&2; fi
'''
